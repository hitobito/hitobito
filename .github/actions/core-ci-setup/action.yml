name: 'Setup steps for core CI'
description: 'DRY yaml setup setup steps which are used multiple times in the core CI workflow'

inputs:
  database:
    description: Unless set to false, prepare the database for the tests
    default: 'true'
  assets:
    description: Unless set to false, assets will be built as part of the setup.
    default: 'true'

runs:
  using: composite
  steps:
    - name: 'Install mise'
      uses: jdx/mise-action@v5
      with:
        minimum_release_age: 7d
        install: false
        cache: false
        env: false
        add_shims_to_path: false

    - name: 'Read tool versions from mise.toml'
      id: toolVersions
      run: |
        mise trust mise.toml
        echo "ruby=$(mise tool ruby --requested)" >> "$GITHUB_OUTPUT"
        echo "node=$(mise tool node --requested)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: 'Set up Ruby ${{ steps.toolVersions.outputs.ruby }} and install gems'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ steps.toolVersions.outputs.ruby }}
        bundler-cache: true

    - name: Set up Node.js ${{ steps.toolVersions.outputs.node }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.toolVersions.outputs.node }}

    - name: 'Setup OS'
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get install -qq --no-install-recommends libvips42 \
          || { sudo apt-get -qq update && sudo apt-get install -qq --no-install-recommends libvips42; }
        echo "ruby version: $(ruby -v)"
        echo "bundle version: $(bundle -v)"
        echo "node version: $(node -v)"
        echo "yarn version: $(yarn -v)"
      shell: bash

    - uses: actions/cache@v5
      if: inputs.assets == 'true'
      with:
        path: node_modules
        key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-node_modules-

    - name: 'Yarn install'
      if: inputs.assets == 'true'
      run: |
        yarn install --frozen-lockfile
      shell: bash

    - uses: actions/cache@v5
      if: inputs.assets == 'true'
      id: assets-cache
      with:
        path: app/assets/builds
        key: ${{ runner.os }}-assets-${{ hashFiles('yarn.lock', 'package.json', 'config/*.mjs', 'app/javascript/**', 'app/components/**/*.js', 'app/assets/stylesheets/**') }}

    - name: 'Build assets'
      if: inputs.assets == 'true' && steps.assets-cache.outputs.cache-hit != 'true'
      run: |
        SKIP_YARN_INSTALL=1 bundle exec rake assets:build_for_test
      shell: bash

    - name: 'Prepare a database per CPU'
      if: inputs.database == 'true'
      run: |
        bundle exec rake parallel:create parallel:load_schema
      shell: bash
