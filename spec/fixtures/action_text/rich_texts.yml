content_user_password_override_body:
  record: content_user_password_override (CustomContent::Translation)
  name: body
  body: |
    Hallo {recipient-name}, <br/>
    {taker-name} hat auf [#{Settings.application.name}] das Passwort deines Accounts zurückgesetzt.
    Dies geschieht typischerweise, wenn jemand den Verdacht hat, dass dein Passwort nicht mehr sicher ist. <br/>
    Im Moment kann sich also niemand mit deinem Account einloggen. Du kannst über die Funktion \"Passwort vergessen\"
    ein neues Passwort anfordern
  plain_text_body: 'Hallo {recipient-name}, \n{taker-name} hat auf [#{Settings.application.name}] das Passwort deines Accounts zurückgesetzt.\nDies geschieht typischerweise, wenn jemand den Verdacht hat, dass dein Passwort nicht mehr sicher ist. \nIm Moment kann sich also niemand mit deinem Account einloggen. Du kannst über die Funktion \"Passwort vergessen\" nein neues Passwort anfordern'

