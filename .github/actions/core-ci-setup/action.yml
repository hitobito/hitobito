name: 'Setup steps for core CI'
description: 'DRY yaml setup setup steps which are used multiple times in the core CI workflow'

inputs:
  database:
    description: Unless set to false, prepare the database for the tests
    default: 'true'
  assets:
    description: Unless set to false, assets will be built as part of the setup.
    default: 'true'

runs:
  using: composite
  steps:
    - name: 'Set up Ruby and install gems'
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Read .tool-versions
      uses: marocchino/tool-versions-action@v1
      id: readToolVersions

    - name: Set up Node.js ${{ steps.readToolVersions.outputs.nodejs }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.readToolVersions.outputs.nodejs }}

    - name: 'Setup OS'
      run: |
        sudo apt-get -qq update
        sudo apt-get install libvips42
        echo "ruby version: $(ruby -v)"
        echo "bundle version: $(bundle -v)"
        echo "node version: $(node -v)"
        echo "yarn version: $(yarn -v)"
      shell: bash

    - uses: actions/cache@v5
      if: inputs.assets == 'true'
      with:
        path: node_modules
        key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-node_modules-

    - name: 'Yarn install'
      if: inputs.assets == 'true'
      run: |
        yarn install --frozen-lockfile
      shell: bash

    - uses: actions/cache@v5
      if: inputs.assets == 'true'
      id: assets-cache
      with:
        path: app/assets/builds
        key: ${{ runner.os }}-assets-${{ hashFiles('yarn.lock', 'package.json', 'config/*.mjs', 'app/javascript/**', 'app/components/**/*.js', 'app/assets/stylesheets/**') }}

    - name: 'Build assets'
      if: inputs.assets == 'true' && steps.assets-cache.outputs.cache-hit != 'true'
      run: |
        SKIP_YARN_INSTALL=1 bundle exec rake assets:build_for_test
      shell: bash

    - name: 'Prepare the Database'
      if: inputs.database == 'true'
      run: |
        SKIP_CSS_BUILD=1 SKIP_JS_BUILD=1 bundle exec rake db:test:prepare
      shell: bash
