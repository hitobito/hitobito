name: 'Run all wagon tests on core changes'

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Use a specific version of the core for the workflow run. Defaults to the main branch (master, or sac-master during a merge freeze).
        default: ""
      wagon_dependency_ref:
        description: Use a specific version of the wagon dependency for the workflow run. Defaults to the main branch (master, or sac-master during a merge freeze).
        default: ""
      wagon_ref:
        description: Use a specific version of the wagon dependency for the workflow run. Defaults to the main branch (master).
        default: ""
  push:
    branches: [ master, sac-master ]
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'VERSION'
  #pull_request: # this trigger is disabled for now, because it caused our CI runners to be occupied too often
  #  paths-ignore:
  #    - 'doc/**'
  #    - '**.md'
  #    - 'VERSION'
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # auto-cancel previous runs of this same workflow on the same PR, if any are still running
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }} # never cancel runs triggered by the main branch, to allow finding the exact merge that broke a wagon

jobs:
  find-wagons:
    name: 'Find all Puzzle-managed wagons'
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-wagon-tests!') }}
    runs-on: 'ubuntu-latest'
    outputs:
      wagons: ${{ steps.list-wagon-repositories.outputs.wagons }}

    steps:
      - name: 'List wagon repositories'
        id: list-wagon-repositories
        run: |
          WAGONS=$(gh repo list hitobito -L 100 --no-archived --json owner,name | \
            jq -c --arg skip "$SKIP_WAGONS" '($skip | split(" ")) as $skipped |
              map(select(.name | startswith("hitobito_")) |
                { owner: .owner.login, repo: .name, name: .name | ltrimstr("hitobito_") } |
                select(.name | IN($skipped[]) | not))')
          echo "$WAGONS"
          echo "wagons=$WAGONS" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_WAGONS: ${{ vars.WAGON_TESTS_SKIP_WAGONS }}

  run-wagon-tests:
    name: 'Run ${{ matrix.wagon.name }} wagon tests'
    needs:
      - find-wagons
    strategy:
      fail-fast: false
      matrix:
        wagon: ${{ fromJSON(needs.find-wagons.outputs.wagons) }}
      max-parallel: 5 # needed so the wagon matrix does not occupy all the runners at once

    uses: ./.github/workflows/wagon-tests.yml
    with:
      wagon_repository: ${{ matrix.wagon.repo }}
      core_ref: ${{ inputs.core_ref || github.ref }}
      wagon_ref: ${{ inputs.wagon_ref || '' }}
      wagon_dependency_ref: ${{ inputs.wagon_dependency_ref || '' }}
    secrets:
      HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
      HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}

  all-wagon-tests-green:
    name: 'All wagon tests are green'
    needs:
      - find-wagons
      - run-wagon-tests
    # This job must run in every run of this workflow, including the ones where
    # the matrix was never built, because a job skipped by a condition reports
    # as successful to the branch protection. Skipping it would turn a pull
    # request that never ran the wagon tests into a mergeable one.
    if: ${{ !cancelled() }}
    runs-on: 'ubuntu-latest'
    permissions:
      checks: read

    steps:
      - name: 'Check the result of the wagon test matrix'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIND_WAGONS_RESULT: ${{ needs.find-wagons.result }}
          WAGON_TESTS_RESULT: ${{ needs.run-wagon-tests.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # This workflow is also triggered when a pull request receives an
          # unrelated label, which leaves the matrix unbuilt. Report again what
          # this commit achieved earlier instead of discarding that verdict,
          # which would force a full matrix run for every edited label.
          if [ "$FIND_WAGONS_RESULT" = 'skipped' ]; then
            # Take the latest verdict this job reached for the same commit, in order to
            # support re-running a failed wagon test.
            previous=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              -X GET -f check_name='All wagon tests are green' -f status=completed -f per_page=100 \
              --jq '[.check_runs[] | select(.conclusion == "success" or .conclusion == "failure")] |
                    sort_by(.completed_at) | last | .conclusion // "none"')

            case "$previous" in
              success)
                echo "The wagon tests already passed for ${HEAD_SHA}"
                exit 0
                ;;
              failure)
                echo "::error::The wagon tests failed for ${HEAD_SHA}. Re-run the failed jobs of that run."
                exit 1
                ;;
              *)
                echo "::error::The wagon tests did not run. Add the 'run-wagon-tests!' label to this pull request."
                exit 1
                ;;
            esac
          fi

          if [ "$FIND_WAGONS_RESULT" != 'success' ]; then
            echo "::error::Could not determine the wagons to test: $FIND_WAGONS_RESULT"
            exit 1
          fi

          # An empty wagon list leaves the matrix without a single job, which
          # reports as skipped rather than as a failure.
          if [ "$WAGON_TESTS_RESULT" = 'skipped' ]; then
            echo '::error::No wagon was tested, the list of wagons was empty'
            exit 1
          fi

          if [ "$WAGON_TESTS_RESULT" != 'success' ]; then
            echo "::error::At least one wagon did not pass its tests: $WAGON_TESTS_RESULT"
            exit 1
          fi

          echo 'All wagons passed their tests'
