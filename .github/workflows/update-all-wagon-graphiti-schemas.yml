name: 'Update Wagon Graphiti Schemas'

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Use a specific version of the core for the workflow run. Defaults to the main branch.
        default: ""
      wagon_dependency_ref:
        description: Use a specific version of the wagon dependency for the workflow run. Defaults to the main branch.
        default: ""
      wagon_ref:
        description: Use a specific version of the wagon dependency for the workflow run. Defaults to the main branch.
        default: ""
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # auto-cancel previous runs of this same workflow on the same PR, if any are still running

permissions:
  contents: write
  pull-requests: write

jobs:
  find-wagons:
    name: 'Find all affected wagons'
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'update-wagon-graphiti-schema!')
    runs-on: 'ubuntu-latest'
    outputs:
      wagons: ${{ steps.list-wagon-repositories.outputs.wagons }}

    steps:
      - name: 'List wagon repositories with API customizations'
        id: list-wagon-repositories
        run: |
          if [ -z "$API_WAGONS" ]; then
            echo "::error::No wagons configured. Set the repository or organization variable API_CUSTOMIZATION_WAGONS to a space-separated list of wagon names without the hitobito_ prefix, e.g. 'pbs sac_cas sww swb pfadi_de'."
            exit 1
          fi
          WAGONS=$(gh repo list hitobito -L 100 --no-archived --json owner,name | \
            jq -c --arg api "$API_WAGONS" '($api | split(" ")) as $customized |
              map(select(.name | startswith("hitobito_")) |
                { owner: .owner.login, repo: .name, name: .name | ltrimstr("hitobito_") } |
                select(.name | IN($customized[])))')
          echo "$WAGONS"
          echo "wagons=$WAGONS" >> $GITHUB_OUTPUT
        env:
          # This PAT needs access to all repos, Read access to metadata and Read and Write access to actions, code, and pull requests
          GH_TOKEN: ${{ secrets.WAGON_TESTS_GITHUB_TOKEN }}
          # Space-separated names of the wagons with API customizations, without the hitobito_ prefix
          API_WAGONS: ${{ vars.API_CUSTOMIZATION_WAGONS }}

  update-wagon-graphiti-schemas:
    name: 'Update ${{ matrix.wagon.name }} wagon graphiti schema'
    runs-on: 'ubuntu-latest'
    needs: [find-wagons]
    strategy:
      fail-fast: false
      matrix:
        wagon: ${{ fromJSON(needs.find-wagons.outputs.wagons) }}
      max-parallel: 5
    env:
      RAILS_DB_ADAPTER: nulldb
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      WAGON_OWNER: ${{ matrix.wagon.owner }}
      WAGON_REPO: ${{ matrix.wagon.repo }}
      SCHEMA_FILE: spec/support/graphiti/schema.json
      GH_TOKEN: ${{ secrets.WAGON_TESTS_GITHUB_TOKEN }}
    steps:
      - name: Refuse to run for a default branch
        run: |
          if [ "$BRANCH_NAME" = 'master' ]; then
            echo "::error::This workflow pushes to the wagon branch named after the core branch, which would be master here. Run it from a feature branch instead."
            exit 1
          fi

      - name: Determine the core pull request this run belongs to
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # If empty (manual trigger), ask GitHub CLI for a PR matching this branch
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --json number --jq '.[0].number')
          fi

          if [ -n "$PR_NUMBER" ]; then
            echo "Found PR #$PR_NUMBER"
            echo "CORE_REFERENCE=hitobito/hitobito#$PR_NUMBER" >> $GITHUB_ENV
          else
            echo "No PR found for $BRANCH_NAME, referencing the branch instead"
            echo "CORE_REFERENCE=hitobito/hitobito branch $BRANCH_NAME" >> $GITHUB_ENV
          fi

      - name: Check out core with shared setup action
        uses: actions/checkout@v6
        with:
          repository: hitobito/hitobito
          ref: ${{ inputs.core_ref || github.ref }}
          path: .hitobito_core_repo
          fetch-depth: 1

      - name: "Prepare"
        uses: ./.hitobito_core_repo/.github/actions/wagon-ci-setup
        with:
          github_token: ${{ secrets.WAGON_TESTS_GITHUB_TOKEN }}
          migrations: false
          assets: false
          wagon_repository: ${{ matrix.wagon.repo }}
          wagon_dependency_repository: hitobito_youth
          core_ref: ${{ inputs.core_ref || github.ref }}
          wagon_dependency_ref: ${{ inputs.wagon_dependency_ref || 'master' }}
          wagon_ref: ${{ inputs.wagon_ref }}

      - name: Update graphiti schema
        working-directory: ${{ matrix.wagon.repo }}
        run: |
          # Check the new schema against the wagon master, not against the wagon PR branch,
          # so that modifications can be made freely without graphiti reporting breaking changes
          # as long as the wagon PR hasn't been merged yet.
          git fetch --depth=1 origin refs/heads/master
          git checkout FETCH_HEAD -- "$SCHEMA_FILE"

          bundle exec rake app:graphiti:schema:generate

      - name: Commit and push the updated schema
        id: commit-schema
        working-directory: ${{ matrix.wagon.repo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/$WAGON_OWNER/$WAGON_REPO.git"

          cp "$SCHEMA_FILE" "$RUNNER_TEMP/schema.json"

          if git fetch --depth=1 origin "refs/heads/$BRANCH_NAME"; then
            echo "Updating the existing branch $BRANCH_NAME of $WAGON_REPO"
            git checkout -f -B "$BRANCH_NAME" FETCH_HEAD
          else
            echo "Creating the branch $BRANCH_NAME of $WAGON_REPO from $(git rev-parse --abbrev-ref HEAD)"
            git checkout -f -B "$BRANCH_NAME"
          fi

          cp "$RUNNER_TEMP/schema.json" "$SCHEMA_FILE"

          if [ -z "$(git status --porcelain -- "$SCHEMA_FILE")" ]; then
            echo "The schema on $BRANCH_NAME of $WAGON_REPO is already up to date"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git diff -- "$SCHEMA_FILE"
          git add -- "$SCHEMA_FILE"
          git commit -m "Update Graphiti schema ($CORE_REFERENCE)"

          if ! git -c "http.https://github.com/.extraheader=" push origin "HEAD:refs/heads/$BRANCH_NAME"; then
            echo "::error::Could not push to $WAGON_OWNER/$WAGON_REPO. Make sure the WAGON_TESTS_GITHUB_TOKEN secret grants Read and Write access to the code of this repository, and that the hitobito organization has approved it."
            exit 1
          fi

          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Open a pull request with the changes
        if: steps.commit-schema.outputs.changed == 'true'
        run: |
          EXISTING=$(gh pr list --repo "$WAGON_OWNER/$WAGON_REPO" --head "$BRANCH_NAME" --state open --json url --jq '.[0].url')

          if [ -n "$EXISTING" ]; then
            echo "Pushed to the pull request which already exists: $EXISTING"
            exit 0
          fi

          gh pr create \
            --repo "$WAGON_OWNER/$WAGON_REPO" \
            --base "master" \
            --head "$BRANCH_NAME" \
            --title "Update Graphiti schema ($CORE_REFERENCE)" \
            --body "Automated schema update triggered by the 'Update Wagon Graphiti Schemas' workflow of $CORE_REFERENCE."
