person_add_request_person_body:
  record: person_add_request_person (CustomContent::Translation)
  name: body
  body: 'Hallo {recipient-name}<br/><br/>
    {requester-name} möchte dich hier hinzufügen: <br><br/>
    {request-body}<br><br/>
    {requester-name} hat folgende schreibberechtigten Rollen: <br><br/>
    {requester-roles}<br><br/>
    Bitte bestätige oder verwerfe diese Anfrage:<br><br/>
    {answer-request-url}
  '
  plain_text_body: 'Hallo {recipient-name}\n\n {requester-name} möchte dich hier hinzufügen: \n\n {request-body}\n\n {requester-name} hat folgende schreibberechtigten Rollen: \n\n {requester-roles}\n\n Bitte bestätige oder verwerfe diese Anfrage:\n\n {answer-request-url}'

