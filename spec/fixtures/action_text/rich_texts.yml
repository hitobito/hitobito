login_de_body:
  record: login_de (CustomContent::Translation)
  name: body
  body: '
  Hallo {recipient-name}<br/><br/>
  Willkommen bei <%= Settings.application.name %>!
  Unter dem folgenden Link kannst du
  dein Login Passwort setzen:<br/><br/>{login-url}<br/><br/>
  Bis bald!<br/><br/>{sender-name}'
  plain_text_body: 'Hallo {recipient-name}\n\n Willkommen bei <%= Settings.application.name %>! Unter dem folgenden Link kannst du dein Login Passwort setzen:\n\n{login-url}\n\n Bis bald!\n\n{sender-name}'

