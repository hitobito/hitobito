name: 'Run the tests of all wagons depending on a wagon'

# This workflow is used by dependency wagons (a wagon other wagons build upon,
# e.g. hitobito_youth or hitobito_pfadi_de) to test the wagons that depend on
# it against the changes of that wagon.
on:
  workflow_call:
    inputs:
      dependency_wagon_repository:
        description: The wagon whose dependent wagons should be tested, e.g. hitobito_pfadi_de. Defaults to the calling repository.
        type: string
        default: ""
      dependency_wagon_ref:
        description: Use a specific version of the dependency wagon for the workflow run. Defaults to the ref that triggered the calling workflow.
        type: string
        default: ""
      core_ref:
        description: Use a specific version of the core for the workflow run. Defaults to the branch of the triggering ref, or master.
        type: string
        default: ""
      wagon_ref:
        description: Use a specific version of the dependent wagons for the workflow run. Defaults to the branch of the triggering ref, or master.
        type: string
        default: ""
      skip_wagons:
        description: Space separated list of wagon names without the hitobito_ prefix which should not be tested. Defaults to the WAGON_TESTS_SKIP_WAGONS variable.
        type: string
        default: ""
    secrets:
      HEARTBEAT_URL:
        description: "URL to the heartbeat-application"
        required: true
      HEARTBEAT_TOKEN:
        description: "Token to interact with the heartbeat-application"
        required: true

jobs:
  find-dependent-wagons:
    name: 'Find all Puzzle-managed wagons depending on ${{ inputs.dependency_wagon_repository || github.event.repository.name }}'
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'run-wagon-tests!') }}
    runs-on: 'ubuntu-latest'
    outputs:
      wagons: ${{ steps.list-dependent-wagons.outputs.wagons }}

    steps:
      - name: 'List the wagon repositories depending on the wagon'
        id: list-dependent-wagons
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDENCY_WAGON: ${{ inputs.dependency_wagon_repository || github.event.repository.name }}
          SKIP_WAGONS: ${{ inputs.skip_wagons || vars.WAGON_TESTS_SKIP_WAGONS }}
        run: |
          set -euo pipefail

          echo "Looking for the wagons which depend on ${DEPENDENCY_WAGON}"

          candidates=$(gh repo list hitobito -L 100 --no-archived --json name | \
            jq -r --arg skip "$SKIP_WAGONS" '($skip | split(" ")) as $skipped |
              .[].name |
              select(startswith("hitobito_")) |
              select(ltrimstr("hitobito_") | IN($skipped[]) | not)')

          dependents=()
          for repo in $candidates; do
            if [ "$repo" = "$DEPENDENCY_WAGON" ]; then
              continue
            fi

            gemspec=$(gh api "repos/hitobito/${repo}/contents/${repo}.gemspec" -H 'Accept: application/vnd.github.raw') || {
              echo "::warning::Could not read ${repo}.gemspec, skipping ${repo}"
              continue
            }

            if grep -qE "^[^#]*add_dependency[^#]*[\"']${DEPENDENCY_WAGON}[\"']" <<< "$gemspec"; then
              echo "${repo} depends on ${DEPENDENCY_WAGON}"
              dependents+=("$repo")
            fi
          done

          WAGONS=$(printf '%s\n' "${dependents[@]}" | \
            jq -R -s -c 'split("\n") | map(select(length > 0) | { repo: ., name: ltrimstr("hitobito_") })')
          echo "$WAGONS"
          echo "wagons=$WAGONS" >> $GITHUB_OUTPUT

  run-wagon-tests:
    name: 'Run ${{ matrix.wagon.name }} wagon tests'
    needs:
      - find-dependent-wagons
    strategy:
      fail-fast: false
      matrix:
        wagon: ${{ fromJSON(needs.find-dependent-wagons.outputs.wagons) }}
      max-parallel: 5 # needed so the wagon matrix does not occupy all the runners at once

    uses: ./.github/workflows/wagon-tests.yml
    with:
      wagon_repository: ${{ matrix.wagon.repo }}
      core_ref: ${{ inputs.core_ref }}
      wagon_ref: ${{ inputs.wagon_ref }}
      wagon_dependency_ref: ${{ inputs.dependency_wagon_ref || github.ref }}
    secrets:
      HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
      HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}

  all-dependent-wagon-tests-green:
    name: 'All dependent wagon tests are green'
    needs:
      - find-dependent-wagons
      - run-wagon-tests
    # This job must run in every run of this workflow, including the ones where
    # the matrix was never built, because a job skipped by a condition reports
    # as successful to the branch protection. Skipping it would turn a pull
    # request that never ran the wagon tests into a mergeable one.
    if: ${{ !cancelled() }}
    runs-on: 'ubuntu-latest'
    permissions:
      checks: read

    steps:
      - name: 'Check the result of the wagon test matrix'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIND_WAGONS_RESULT: ${{ needs.find-dependent-wagons.result }}
          WAGON_TESTS_RESULT: ${{ needs.run-wagon-tests.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPENDENCY_WAGON: ${{ inputs.dependency_wagon_repository || github.event.repository.name }}
        run: |
          # This workflow is also triggered when a pull request receives an
          # unrelated label, which leaves the matrix unbuilt. Report again what
          # this commit achieved earlier instead of discarding that verdict,
          # which would force a full matrix run for every edited label.
          if [ "$FIND_WAGONS_RESULT" = 'skipped' ]; then
            # Take the latest verdict this job reached for the same commit, in order to
            # support re-running a failed wagon test.
            previous=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              -X GET -f status=completed -f per_page=100 | \
              jq -r '[.check_runs[] |
                     select(.name | endswith("All dependent wagon tests are green")) |
                     select(.conclusion == "success" or .conclusion == "failure")] |
                    sort_by(.completed_at) | last | .conclusion // "none"')

            case "$previous" in
              success)
                echo "The dependent wagon tests already passed for ${HEAD_SHA}"
                exit 0
                ;;
              failure)
                echo "::error::The dependent wagon tests failed for ${HEAD_SHA}. Re-run the failed jobs of that run."
                exit 1
                ;;
              *)
                echo "::error::The dependent wagon tests did not run. Add the 'run-wagon-tests!' label to this pull request."
                exit 1
                ;;
            esac
          fi

          if [ "$FIND_WAGONS_RESULT" != 'success' ]; then
            echo "::error::Could not determine the wagons depending on ${DEPENDENCY_WAGON}: $FIND_WAGONS_RESULT"
            exit 1
          fi

          # An empty wagon list leaves the matrix without a single job, which
          # reports as skipped rather than as a failure.
          if [ "$WAGON_TESTS_RESULT" = 'skipped' ]; then
            echo "::error::No wagon was tested, no wagon depending on ${DEPENDENCY_WAGON} was found"
            exit 1
          fi

          if [ "$WAGON_TESTS_RESULT" != 'success' ]; then
            echo "::error::At least one wagon did not pass its tests: $WAGON_TESTS_RESULT"
            exit 1
          fi

          echo "All wagons depending on ${DEPENDENCY_WAGON} passed their tests"
