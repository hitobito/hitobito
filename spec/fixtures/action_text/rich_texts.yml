  record: content_invoice_notification (CustomContent::Translation)
  name: body
  body: '<p>Hallo {recipient-name}</p>
   <p>Rechnung von:</p>
   <p><b>Absender: {group-address}</b></p>
   <br/><br/>
   {invoice-items}<br/><br/>
