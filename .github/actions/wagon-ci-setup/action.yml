name: "Setup steps for wagon CI"
description: "DRY yaml setup setup steps which are used multiple times in the wagon CI workflow"

inputs:
  github_token:
    description: Token for repository access (defaults to GITHUB_TOKEN)
    required: false
    default: ${{ github.token }}
  migrations:
    description: Unless set to false, migrations will be run as part of the setup.
    default: "true"
  assets:
    description: Unless set to false, the assets compilation will be run as part of the setup.
    default: "true"
  wagon_repository:
    description: "Wagon repository, e.g. hitobito_pbs"
  wagon_dependency_repository:
    description: A wagon this wagon depends on, e.g. hitobito_youth
    required: false
    default: ""
  core_ref:
    description: Use a specific version of the core for the workflow run. Defaults to master.
    default: ""
  wagon_dependency_ref:
    description: Use a specific version of the wagon dependency for the workflow run. Defaults to master.
    default: ""
  wagon_ref:
    description: Use a specific version of the wagon for the workflow run. Defaults to the current ref.
    default: ""

runs:
  using: composite
  steps:
    - name: "Determine common branch and set branch name for core"
      env:
        INPUT_CORE_REF: ${{ inputs.core_ref }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        CORE_REF="$INPUT_CORE_REF"
        if [ -z "$CORE_REF" ]; then
          REQUIRED_CORE_PR=$(grep -oiP '^\s*requires:?\s+hitobito/hitobito#\K[0-9]+' <<< "$PR_BODY" | head -n 1 || true)
          if [ -n "$REQUIRED_CORE_PR" ]; then
            CORE_REF="refs/pull/$REQUIRED_CORE_PR/head"
          fi
        fi
        if [ -z "$CORE_REF" ]; then
          CORE_REF=$(git ls-remote --heads https://github.com/hitobito/hitobito | cut -d/ -f3- | grep -x "${{github.head_ref || github.ref_name}}" || echo 'master')
        fi

        echo "CORE_REF=$CORE_REF" >> $GITHUB_ENV
      shell: bash

    - name: "Determine common branch and set branch name for dependency repo"
      if: inputs.wagon_dependency_repository != ''
      working-directory: .hitobito_core_repo
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        CORE_REF: ${{ env.CORE_REF }}
        WAGON_DEPENDENCY_REPO: ${{ inputs.wagon_dependency_repository }}
        INPUT_WDEP_REF: ${{ inputs.wagon_dependency_ref }}
        INPUT_WAGON_REF: ${{ inputs.wagon_ref }}
        WAGON_HEAD_REF: ${{github.head_ref || github.ref_name}}
      run: |
        REPO_URL="https://github.com/hitobito/$WAGON_DEPENDENCY_REPO"
        REMOTE_BRANCHES=$(git ls-remote --heads "$REPO_URL" | awk -F'refs/heads/' '{print $2}')

        if [ -n "$INPUT_WDEP_REF" ]; then
          RESOLVED_REF="$INPUT_WDEP_REF"
        else
          PR_BRANCH=""
          if [[ "$CORE_REF" =~ refs/pull/([0-9]+)/ ]]; then
            PR_BRANCH=$(gh pr view "${BASH_REMATCH[1]}" --repo hitobito/hitobito --json headRefName -q '.headRefName' 2>/dev/null || echo "")
          fi

          for candidate_name in "INPUT_CORE_REF" "PR_BRANCH" "INPUT_WAGON_REF" "WAGON_HEAD_REF"; do
            candidate="${!candidate_name}"

            if [ -z "$candidate" ]; then
              echo "INFO: Skipping $candidate_name, candidate value is empty"
              continue
            fi

            if echo "$REMOTE_BRANCHES" | grep -xq "$candidate"; then
              RESOLVED_REF="$candidate"
              echo "INFO: MATCH FOUND in $candidate_name: $RESOLVED_REF"
              break
            else
              echo "INFO: No match for $candidate_name ('$candidate')"
            fi
          done
        fi

        RESOLVED_REF="${RESOLVED_REF:-master}"

        echo "WAGON_DEPENDENCY_REF=$RESOLVED_REF" >> $GITHUB_ENV
      shell: bash

    - name: "Determine common branch and set branch name for wagon repo"
      env:
        WAGON_REPO: ${{ inputs.wagon_repository }}
        INPUT_WAGON_REF: ${{ inputs.wagon_ref }}
        GH_REPOSITORY: ${{ github.repository }}
        CURRENT_SHA: ${{ github.sha }}
      run: |
        if [ -n "$INPUT_WAGON_REF" ]; then
          WAGON_REF="$INPUT_WAGON_REF"
        elif [ "$GH_REPOSITORY" == "hitobito/$WAGON_REPO" ]; then
          # This wagon triggered the run, so github.sha is the commit under test, even from a fork.
          WAGON_REF="$CURRENT_SHA"
        elif [ "$WAGON_REPO" != '' ]; then
          WAGON_REF=$(git ls-remote --heads https://github.com/hitobito/$WAGON_REPO | cut -d/ -f3- | grep -x "${{github.head_ref || github.ref_name}}" || echo 'master')
        fi

        echo "WAGON_REF=$WAGON_REF" >> $GITHUB_ENV
      shell: bash

    - name: "Checkout hitobito at ${{ env.CORE_REF }}"
      uses: actions/checkout@v6
      with:
        repository: "hitobito/hitobito"
        ref: ${{ env.CORE_REF }}
        token: ${{ inputs.github_token }}
        path: "hitobito"

    - name: "Install mise"
      uses: jdx/mise-action@v5
      with:
        install: false
        cache: false
        env: false
        add_shims_to_path: false

    - name: "Read tool versions from mise.toml"
      id: toolVersions
      run: |
        mise trust mise.toml
        echo "ruby=$(mise tool ruby --requested)" >> "$GITHUB_OUTPUT"
        echo "node=$(mise tool node --requested)" >> "$GITHUB_OUTPUT"
      working-directory: hitobito
      shell: bash

    - name: "Set up Ruby ${{ steps.toolVersions.outputs.ruby }}"
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ steps.toolVersions.outputs.ruby }}
        working-directory: hitobito

    - name: 'Configure Bundler'
      run: |
        echo "BUNDLE_PATH=$PWD/vendor/bundle" >> $GITHUB_ENV
      working-directory: hitobito
      shell: bash

    - name: "Set up Node ${{ steps.toolVersions.outputs.node }}"
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.toolVersions.outputs.node }}

    - name: "Setup OS"
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get install -qq --no-install-recommends libvips42 \
          || { sudo apt-get -qq update && sudo apt-get install -qq --no-install-recommends libvips42; }
        echo "ruby version: $(ruby -v)"
        echo "node version: $(node -v)"
        echo "yarn version: $(yarn -v)"
      working-directory: hitobito
      shell: bash

    - name: "Copy Wagonfile.ci"
      run: |
        cp -v Wagonfile.ci Wagonfile
      working-directory: hitobito
      shell: bash

    - name: "Checkout dependency ${{ inputs.wagon_dependency_repository }} at ${{ env.WAGON_DEPENDENCY_REF }}"
      uses: actions/checkout@v6
      if: ${{ inputs.wagon_dependency_repository != '' }}
      with:
        repository: hitobito/${{ inputs.wagon_dependency_repository }}
        ref: ${{ env.WAGON_DEPENDENCY_REF }}
        token: ${{ inputs.github_token }}
        path: ${{ inputs.wagon_dependency_repository }}

    - name: Checkout ${{ inputs.wagon_repository }}
      uses: actions/checkout@v6
      with:
        repository: hitobito/${{ inputs.wagon_repository }}
        ref: ${{ env.WAGON_REF }}
        token: ${{ inputs.github_token }}
        path: ${{ inputs.wagon_repository }}

    - name: "Create cache key"
      run: cp Gemfile.lock Gemfile.lock.backup
      working-directory: hitobito
      shell: bash

    - uses: actions/cache@v5
      with:
        path: hitobito/vendor/bundle
        key: ${{ runner.os }}-ruby-bundle-${{ hashFiles('**/Gemfile.lock.backup') }}
        restore-keys: |
          ${{ runner.os }}-ruby-bundle-

    - name: "Bundle install core"
      run: |
        bundle install --jobs 4 --retry 3
      working-directory: hitobito
      shell: bash

    - name: "Make changes to Gemfile.lock transparent"
      run: |
        git diff Gemfile.lock || true
      working-directory: hitobito
      shell: bash

    - name: "Bundle install wagons"
      run: |
        hitobito_dir=$(realpath ./)
        for d in $hitobito_dir/../hitobito_*; do
          cd $d
          cp -v $hitobito_dir/Gemfile.lock ./
          bundle install --jobs 4 --retry 3
        done
      working-directory: hitobito
      shell: bash

    - uses: actions/cache@v5
      if: inputs.assets == 'true'
      with:
        path: hitobito/node_modules
        key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-node_modules-

    - name: "Yarn install"
      if: inputs.assets == 'true'
      run: |
        yarn install --frozen-lockfile
      working-directory: hitobito
      shell: bash

    - uses: actions/cache@v5
      if: inputs.assets == 'true'
      id: assets-cache
      with:
        path: hitobito/app/assets/builds
        key: ${{ runner.os }}-assets-${{ inputs.wagon_repository }}-${{ hashFiles('hitobito/yarn.lock', 'hitobito/package.json', 'hitobito/config/*.mjs', 'hitobito/app/javascript/**', 'hitobito/app/components/**/*.js', 'hitobito/app/assets/stylesheets/**', 'hitobito_*/app/javascript/**', 'hitobito_*/app/assets/javascripts/**', 'hitobito_*/app/assets/stylesheets/**') }}

    - name: "Build assets"
      if: inputs.assets == 'true' && steps.assets-cache.outputs.cache-hit != 'true'
      run: |
        SKIP_YARN_INSTALL=1 bundle exec rake assets:build
      working-directory: hitobito
      shell: bash

    - name: "Prepare DB"
      if: inputs.migrations == 'true'
      run: |
        SKIP_TEST_DATABASE=true bundle exec rake db:schema:load wagon:migrate
      working-directory: hitobito
      shell: bash

    - name: "Copy the migrated test database for each further CPU"
      if: inputs.migrations == 'true' && env.RAILS_TEST_DB_NAME != ''
      run: |
        for number in $(seq 2 "$(nproc)"); do
          PGPASSWORD="$RAILS_DB_PASSWORD" psql -h "$RAILS_DB_HOST" -U "$RAILS_DB_USERNAME" -d postgres \
            -c "CREATE DATABASE ${RAILS_TEST_DB_NAME}${number} TEMPLATE ${RAILS_TEST_DB_NAME}"
        done
      shell: bash
